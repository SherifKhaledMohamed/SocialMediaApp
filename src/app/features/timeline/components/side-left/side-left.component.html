<aside
  class="w-full text-sm sticky top-0 bg-white rounded-[20px] shadow-sm border border-slate-50 p-2.5 flex flex-row lg:flex lg:flex-col gap-1"
  aria-label="Sidebar Navigation"
>
  <button
    [routerLink]="['/timeline']"
    routerLinkActive="bg-blue-50 text-blue-600!"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold transition-colors duration-200 w-1/4 lg:w-full"
  >
    <i class="fa-regular fa-newspaper w-5 text-center"></i>
    <span class="">Feed</span>
  </button>

  <button
    [routerLink]="['/timeline', 'myposts']"
    routerLinkActive="bg-blue-50 text-blue-600!"
    class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors duration-200 group w-1/4 lg:w-full"
  >
    <i
      class="fa-solid fa-wand-magic-sparkles w-5 text-center group-hover:text-slate-700 transition-colors"
    ></i>
    <span class="">My Posts</span>
  </button>

  <button
    [routerLink]="['/timeline', 'saved']"
    routerLinkActive="bg-blue-50 text-blue-600!"
    class="flex items-center gap-4 p-2 cursor-pointer rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors duration-200 group w-1/4 lg:w-full"
  >
    <i
      class="fa-regular fa-bookmark w-5 text-center group-hover:text-slate-700 transition-colors"
    ></i>
    <span class="">Saved</span>
  </button>
</aside>
